[package]
name = "pilar-core"
version = "0.1.0"
edition = "2024"

[dependencies]
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"
stop-words = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Embeds a Python interpreter so spaCy's NER can run inside the pipeline
# without a subprocess per chunk. auto-initialize links against whatever
# `python3` resolves to at build time (see README for the runtime
# dependency this adds).
pyo3 = { version = "0.23", features = ["auto-initialize"] }

# pilar-server (MCP/HTTP wrapper around the pipeline) dependencies below.
# The pipeline itself (embed.rs, enrich.rs) stays synchronous/blocking --
# reqwest::blocking -- so pilar_server.rs runs those calls via
# tokio::task::spawn_blocking rather than converting the pipeline to async.
rmcp = { version = "3.4.1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
schemars = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "infer"
path = "src/bin/infer.rs"

[[bin]]
name = "pilar-server"
path = "src/bin/pilar_server.rs"